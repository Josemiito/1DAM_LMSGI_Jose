<!DOCTYPE html>
<html>
<head>
    <title>max-width y min-width</title>
    <style>

        *{
            box-sizing: border-box;
        }

        body{
            background-image: url("img/medac-estudia-deporte.png");
            background-repeat: no-repeat;
            background-attachment: scroll;
            background-position: center;
            background-size: 400px 400px;
        }
        p{
            border: solid 2px grey;
            padding: 10px;
            width: 50%;
        }
    </style>
</head>
<body>
    <h1>Propiedad background</h1>
    <p>Este párrafo no va a crecer más de 500px</p>
</body>
</html>
