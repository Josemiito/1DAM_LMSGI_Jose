<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="proceso.php" method="post">
        <fieldset>
            <legend>Formulario</legend>
            Nombre: <input type="text" name="nombre" id="" placeholder="Nombre">
            <br>
            Contraseña: <input type="password" name="contraseña" id="" required>
            <br>
            Email: <input type="email" name="email" id="">
            <br>
            Url: <input type="url" name="url" id="">
            <br>
            Fecha: <input type="date" name="date" id="">
            <br>
            Color: <input type="color" name="color" id="">
            <br>
            Rango: <input type="range" name="rango" id="" min="100" max="200" >(Mínimo 100 y máximo 200)
            <br>
            Número: <input type="number" name="numero" id="" max="9">
            <br>
            Números pares: <input type="number" name="pares" id="" step="2">
        </fieldset>
    </form>
</body>
</html>
